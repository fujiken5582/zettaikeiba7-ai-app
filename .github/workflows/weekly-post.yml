name: Weekly Race Prediction Post

on:
  schedule:
    # 土日朝8:00 JST = UTC 23:00 前日 (当日の予測)
    - cron: '0 23 * * 5,6'
    # 木曜・金曜の朝7:00 JST = UTC 22:00 (前日UTC) → 今週末（土日）の速報
    # 水曜UTC 22:00 = 木曜JST 07:00、木曜UTC 22:00 = 金曜JST 07:00
    - cron: '0 22 * * 3,4'
  workflow_dispatch:
    inputs:
      target_day:
        description: '対象日'
        required: false
        default: 'today'
        type: choice
        options:
          - today
          - tomorrow
          - weekend

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine target day
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_day=${{ github.event.inputs.target_day }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 22 * * 3,4" ]; then
            # 木曜・金曜朝の今週末速報
            echo "target_day=weekend" >> $GITHUB_OUTPUT
          else
            # 土日朝の当日予測
            echo "target_day=today" >> $GITHUB_OUTPUT
          fi

      - name: Generate posts
        env:
          APP_URL: https://zettaikeiba7-ai-app-1.onrender.com
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TARGET_DAY: ${{ steps.target.outputs.target_day }}
        run: node scripts/generate_posts.js

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "🤖 自動投稿生成: $(date '+%Y-%m-%d')"
            git push
          fi
